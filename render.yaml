services:
  - type: web
    name: Swift_Delivery
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Swift_Delivery.settings
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: Swift_Delivery_DB
          property: connectionString
      - key: GOOGLE_MAPS_ADMIN_BROWSER_API_KEY
        sync: false
    plan: free
    autoDeploy: true

databases:
  - name: Swift_Delivery_DB
    plan: free

      
