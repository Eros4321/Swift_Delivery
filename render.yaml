services:
  - type: web
    name: Swift_Delivery
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn Swift_Delivery.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Swift_Delivery.settings
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SECRET_KEY
        value: your-dev-secret-key
      - key: DATABASE_URL
        fromDatabase:
          name: Swift_Delivery_DB
          property: connectionString
    plan: free
    autoDeploy: true

databases:
  - name: Swift_Delivery_DB
    plan: free

      
